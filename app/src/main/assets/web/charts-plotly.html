<!DOCTYPE html>
<html lang="en-EN">

<head>
    <title>Plotly.js Charts</title>
    <meta charset="utf-8">
    <meta content="width=device-width" name="viewport">
    <!-- Load Plotly.js from local assets -->
    <script src="./plotly-3.0.1.min.js" type="text/javascript"></script>
    <style>
        body {
            margin: 0;
        }

        .chart-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>
<!-- Plotly uses simple div containers -->
<div class="chart-container" id="frequencyChart"></div>
<div class="chart-container" id="volumeChart"></div>

<script type="text/javascript">
    function displayFrequencyChart(rawData, xMinAllowed, xMaxAllowed, yMinAllowed, yMaxAllowed, staticPlot, color, fillColor, paper_bgcolor, plot_bgcolor, axes_color, gridcolor) {

        const element = document.getElementById("volumeChart");
        element.remove();

        console.log(JSON.stringify(rawData));

        // 1. Define the data trace for the bar chart
        const trace = {
            x: rawData.labels,
            y: rawData.values,
            type: 'bar',
            marker: {
                color: color
            }
        };

        // 2. Define the layout of the chart
        const layout = {
            title: 'Workouts',
            paper_bgcolor: paper_bgcolor,
            plot_bgcolor: plot_bgcolor,
            margin: { t: 30, b: 30, l: 30, r: 10 }, // top, bottom, left, right
            xaxis: {
                automargin: true,
                minallowed: 0,
                maxallowed: rawData.labels.length,
                type: 'category',
                color: axes_color,
                gridcolor: gridcolor
            },
            yaxis: {
                automargin: true,
                minallowed: 0,
                maxallowed: yMaxAllowed,
                color: axes_color,
                gridcolor: gridcolor,
                separatethousands: true
            }
        };

        // 3. Configuration options
        const config = {
            displayModeBar: false, // Hides the floating mode bar
            responsive: true, // Makes the chart responsive to container size
            staticPlot: staticPlot,
            editable: false,
            scrollZoom: false,

        };

        // 4. Create the plot
        Plotly.newPlot('frequencyChart', [trace], layout, config);
    }

    function displayVolumeChart(rawData, xMinAllowed, xMaxAllowed, yMinAllowed, yMaxAllowed, staticPlot, color, fillColor, paper_bgcolor, plot_bgcolor, axes_color, gridcolor) {
        // 1. Define the data trace for the line chart
        const element = document.getElementById("frequencyChart");
        element.remove();

        console.log(JSON.stringify(rawData));

        const trace = {
            x: rawData.labels,
            y: rawData.values,
            type: 'scatter', // 'scatter' is used for line charts in Plotly
            mode: 'lines+markers',
            fill: 'tozeroy', // Fills the area under the line to the y-axis
            line: {
                color: color,
                width: 2
            },
            fillcolor: fillColor,
        };

        // 2. Define the layout
        const layout = {
            // title: 'Total Training Volume',
            paper_bgcolor: paper_bgcolor,
            plot_bgcolor: plot_bgcolor,
            margin: { t: 30, b: 30, l: 50, r: 10 },
            xaxis: {
                automargin: true,
                minallowed: 0,
                maxallowed: rawData.labels.length,
                type: 'category',
                color: axes_color,
                gridcolor: gridcolor
            },
            yaxis: {
                automargin: true,
                minallowed: 0,
                maxallowed: yMaxAllowed,
                color: axes_color,
                gridcolor: gridcolor,
                separatethousands: true
            }
        };

        // 3. Configuration options
        const config = {
            displayModeBar: false,
            responsive: true,
            editable: false,
            scrollZoom: false,
            staticPlot: staticPlot
        };

        // 4. Create the plot
        Plotly.newPlot('volumeChart', [trace], layout, config);
    }

</script>
</body>

</html>
